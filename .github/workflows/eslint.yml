name: CI

on:
  push:
    branches: ["main", "recovery/p1-item-contracts"]
  pull_request:
    branches: ["main", "recovery/p1-item-contracts"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Shared authorization tests
        run: npm test -w packages/shared-auth

      - name: Auth tests
        run: npm test -w auth-service

      - name: Barcode tests
        run: npm test -w barcode-service

      - name: Inventory tests
        run: npm test -w inventory-service -- --runInBand

      - name: Frontend lint
        run: npm run lint -w frontend -- --max-warnings=0

      - name: Frontend tests
        run: npm test -w frontend -- --watchAll=false --passWithNoTests
        env:
          CI: "true"

      - name: Frontend production build
        run: npm run build -w frontend
        env:
          CI: "true"
          REACT_APP_API_BASE_URL: "https://example.invalid"
