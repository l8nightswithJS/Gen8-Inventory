name: CI

on:
  push:
    branches: ["main", "recovery/p1-item-contracts"]
  pull_request:
    branches: ["main", "recovery/p1-item-contracts"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Shared authorization tests
        run: npm test -w packages/shared-auth

      - name: Authentication tests
        run: npm test -w auth-service

      - name: Client service tests
        run: npm test -w client-service

      - name: Barcode service tests
        run: npm test -w barcode-service

      - name: Inventory service tests
        run: npm test -w inventory-service -- --runInBand

      - name: Frontend tests
        run: npm test -w frontend -- --watchAll=false
        env:
          CI: true

      - name: Production frontend build
        run: npm run build -w frontend
        env:
          REACT_APP_API_BASE_URL: https://example.invalid
